name: production cd pipeline

on:
  push:
    branches:
      - main
    paths:
      - K8-manifest/prod/**
      - .github/workflows/prod-cicd.yml

permissions:
  contents: write
  id-token: write

jobs:
  promote-image-to-prod:
    name: Pull QA latest and retag for prod
    runs-on: ubuntu-latest

    env:
      QA_IMAGE: mayankdev12/nodejs-app:latest
      PROD_LATEST_IMAGE: mayankdev12/nodejs-app:${{ github.sha }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull QA latest image
        run: docker pull "${QA_IMAGE}"

      - name: Retag image for production
        run: |
          docker tag "${QA_IMAGE}" "${PROD_LATEST_IMAGE}"

      - name: Push prod image
        run: |
          docker push "${PROD_LATEST_IMAGE}"

  update-prod-manifest:
    name: Update prod manifest
    needs: promote-image-to-prod
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tag in manifest
        run: |
          sed -i "s|image:.*|image: mayankdev12/nodejs-app:${GITHUB_SHA}|g" K8-manifest/prod/app-deployment.yaml

      - name: Show updated manifest (debug)
        run: |
          cat K8-manifest/prod/app-deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add K8-manifest/prod/app-deployment.yaml
          git commit -m "Update production image to ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"
          git push origin main

  deploy-to-k8s:
    name: Deploy to Kubernetes prod
    needs: update-prod-manifest
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: cluster
      K8S_NAMESPACE: prod

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Verify identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context

      - name: Verify namespace access
        run: |
          kubectl get pods -n "${{ env.K8S_NAMESPACE }}"
          kubectl get services -n "${{ env.K8S_NAMESPACE }}"
          kubectl auth can-i create deployments -n "${{ env.K8S_NAMESPACE }}"
          kubectl auth can-i create services -n "${{ env.K8S_NAMESPACE }}"
          kubectl auth can-i create ingresses.networking.k8s.io -n "${{ env.K8S_NAMESPACE }}"

      - name: Deploy manifests
        run: |
          kubectl apply -f K8-manifest/prod/ -n "${{ env.K8S_NAMESPACE }}"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/nodejs-app \
            -n "${{ env.K8S_NAMESPACE }}" \
            --timeout=180s
