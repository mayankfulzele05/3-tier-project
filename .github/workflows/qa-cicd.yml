name: cicd pipeline

on:
  push:
    branches:
      - qa
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/qa-cicd.yml'

jobs:
  gitleaks-scan:
    name: gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: run gitleaks scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code=0

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-terraform:
    name: terraform scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: run checkov terraform
        run: |
          checkov -d . \
            --framework terraform \
            --skip-download \
            --output json > checkov-terraform-report.json || true

      - name: upload checkov terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov report terraform
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: docker scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: run checkov docker
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true

      - name: upload checkov docker report
        uses: actions/upload-artifact@v4
        with:
          name: checkov report dockerfile
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  checkov-k8s: 
    name: k8s scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: run checkov k8s
        run: |
          checkov -d . \
            --framework kubernetes \
            --output json > checkov-k8s-report.json || true

      - name: upload checkov k8s report
        uses: actions/upload-artifact@v4
        with:
          name: checkov report k8s
          path: checkov-k8s-report.json
          if-no-files-found: warn

  client-trivy-fs:
    name: trivy scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: verify trivy installation
        run: |
          trivy --version
          which trivy

      - name: trivy scan
        run: |
          trivy fs ./client \
            --format json \
            --output client-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: trivy scan table
        run: |
          trivy fs ./client \
            --format table \
            --output client-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: upload trivy scan report json
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-scan-report-json
          path: client-trivy-fs-report.json
          if-no-files-found: warn

      - name: upload trivy scan report table
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-scan-report-table
          path: client-trivy-fs-report.txt
          if-no-files-found: warn

  server-trivy-fs:
    name: trivy scan server
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: verify trivy installation
        run: |
          trivy --version
          which trivy

      - name: trivy scan for server
        run: |
          trivy fs ./server \
            --format json \
            --output server-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: trivy scan table for server
        run: |
          trivy fs ./server \
            --format table \
            --output server-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: upload trivy scan report json
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-scan-report-json
          path: server-trivy-fs-report.json
          if-no-files-found: warn

      - name: upload trivy scan report table
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-scan-report-table
          path: server-trivy-fs-report.txt
          if-no-files-found: warn

  sonarqube:
    name: sonarqube analysis and quality gate check     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug
      run: |
        pwd
        ls -la
        echo "---------"
        find . -name "sonar-project.properties"
        echo "---------"
        cat sonar-project.properties


      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: "Example show SonarQube Quality Gate Status value"
        run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
