name: cicd pipeline

on:
  push:
    branches:
      - qa
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/qa-cicd.yml'

jobs:
  gitleaks-scan:
    name: gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: run gitleaks scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code=0

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-terraform:
    name: terraform scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: run checkov terraform
        run: |
          checkov -d . \
            --framework terraform \
            --skip-download \
            --output json > checkov-terraform-report.json || true

      - name: upload checkov terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov report terraform
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: docker scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: run checkov docker
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true

      - name: upload checkov docker report
        uses: actions/upload-artifact@v4
        with:
          name: checkov report dockerfile
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  checkov-k8s:
    name: k8s scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: run checkov k8s
        run: |
          checkov -d . \
            --framework kubernetes \
            --output json > checkov-k8s-report.json || true

      - name: upload checkov k8s report
        uses: actions/upload-artifact@v4
        with:
          name: checkov report k8s
          path: checkov-k8s-report.json
          if-no-files-found: warn

  client-trivy-fs:
    name: trivy scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: verify trivy installation
        run: |
          trivy --version
          which trivy

      - name: trivy scan
        run: |
          trivy fs ./client \
            --format json \
            --output client-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: trivy scan table
        run: |
          trivy fs ./client \
            --format table \
            --output client-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: upload trivy scan report json
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-scan-report-json
          path: client-trivy-fs-report.json
          if-no-files-found: warn

      - name: upload trivy scan report table
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-scan-report-table
          path: client-trivy-fs-report.txt
          if-no-files-found: warn

  server-trivy-fs:
    name: trivy scan server
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: source code
        uses: actions/checkout@v4

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: verify trivy installation
        run: |
          trivy --version
          which trivy

      - name: trivy scan for server
        run: |
          trivy fs ./server \
            --format json \
            --output server-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: trivy scan table for server
        run: |
          trivy fs ./server \
            --format table \
            --output server-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: upload trivy scan report json
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-scan-report-json
          path: server-trivy-fs-report.json
          if-no-files-found: warn

      - name: upload trivy scan report table
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-scan-report-table
          path: server-trivy-fs-report.txt
          if-no-files-found: warn

  client-lint:
    name: client lint
    runs-on: ubuntu-latest
    needs:
      - client-trivy-fs
      - checkov-terraform
      - checkov-dockerfile
      - checkov-k8s
    defaults:
      run:
        working-directory: client
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: run client lint
        run: npm run lint --if-present
        continue-on-error: true

  server-lint:
    name: server lint
    runs-on: ubuntu-latest
    needs:
      - server-trivy-fs
      - checkov-terraform
      - checkov-dockerfile
      - checkov-k8s
    defaults:
      run:
        working-directory: server
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: run server lint
        run: npm run lint --if-present
        continue-on-error: true

  client-test:
    name: client test
    runs-on: ubuntu-latest
    needs:
      - client-lint
    defaults:
      run:
        working-directory: client
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: run client test
        run: npm test --if-present
        continue-on-error: true

  server-test:
    name: server test
    runs-on: ubuntu-latest
    needs:
      - server-lint
    defaults:
      run:
        working-directory: server
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: run server test
        run: npm test --if-present
        continue-on-error: true

  sonarqube:
    name: sonarqube analysis and quality gate check
    runs-on: ubuntu-latest
    needs:
      - server-test
      - client-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug
        run: |
          pwd
          ls -la
          echo "----------"
          find . -name "sonar-project.properties"
          echo "----------"
          if [ -f "sonar-project.properties" ]; then cat sonar-project.properties; fi

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: "Example show SonarQube Quality Gate Status value"
        run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
        
  client-build:
    name: client build
    runs-on: ubuntu-latest
    needs: client-test
    defaults:
      run:
        working-directory: client
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: run client build
        run: npm run build --if-present
        continue-on-error: true

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs:
      - sonarqube
      - client-build
      - server-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            mayankdev12/nodejs-app:${{ github.sha }}
            mayankdev12/nodejs-app:latest

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: verify trivy installation
        run: |
          trivy --version
          which trivy

      - name: trivy scan
        run: |
          trivy image mayankdev12/nodejs-app:${{ github.sha }} \
            --format json \
            --output image-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: trivy scan table
        run: |
          trivy image mayankdev12/nodejs-app:${{ github.sha }} \
            --format table \
            --output image-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: upload trivy scan report json
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-scan-report-json
          path: image-trivy-fs-report.json
          if-no-files-found: warn

      - name: upload trivy scan report table
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-scan-report-table
          path: image-trivy-fs-report.txt
          if-no-files-found: warn

      - name: Push Image to Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mayankdev12/nodejs-app:${{ github.sha }}
            mayankdev12/nodejs-app:latest

